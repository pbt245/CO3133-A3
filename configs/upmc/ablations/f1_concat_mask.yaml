# E2 - modality contribution [MANDATORY]: F1 trained and tested on titles where every class-name mention (lexicon
# of src/data/text.py: the 101 names, singular/plural, synonyms) is replaced by [MASK], in train, val and test.
base: ../f1_concat.yaml

experiment:
  name: f1_concat_mask
  id: E2-F1
  group: ablation
  reference: f1_concat
  changed_factor: "text.mask_class_names: false -> true"
  hypothesis: "masking lowers UB by >= 10 pp, widens the fusion gain over UB, helps F2 on conflict items"
  decision_criterion: "decision rule per model; F2 - UB gap as mean +- std"

text:
  mask_class_names: true
